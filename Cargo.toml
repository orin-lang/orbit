[workspace]
resolver = "3"
members = ["crates/orbit-abi", "crates/orbit-runtime", "crates/orbit-caps", "crates/orbit-cli"]
# Standalone guest programs built for wasm32 (see tests/guests/build.sh).
exclude = ["tests/guests/wasi-hello"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false

[workspace.dependencies]
orbit-abi = { path = "crates/orbit-abi" }
orbit-runtime = { path = "crates/orbit-runtime" }
orbit-caps = { path = "crates/orbit-caps" }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "async", "pooling-allocator", "runtime", "wat", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wat = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
